name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax-check all Python files
        run: python -m compileall scripts

      - name: Validate example config is valid JSON
        run: python -c "import json; json.load(open('config.example.json'))"

      - name: Validate catalog and uploader import cleanly
        run: |
          pip install boto3 tqdm
          python -c "
          import sys; sys.path.insert(0, 'scripts')
          from lib import catalog, common, hls, probe, thumbs
          print('imports OK')
          "
