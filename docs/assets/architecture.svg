<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 770" width="1200" height="770" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">3B Archive architecture</title>
  <desc id="d">Browser and iPhone connect to a single CloudFront distribution with three behaviors: the site and videos are served from a private S3 bucket, and the API goes through API Gateway to Lambda, which uses DynamoDB and SSM Parameter Store. Browsers upload directly to S3 using presigned URLs.</desc>

  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#000"/>
    </marker>
    <marker id="ahb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2B3FFF"/>
    </marker>
  </defs>

  <style>
    .sans { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
  </style>

  <rect x="2" y="2" width="1196" height="766" fill="#F3F3EF" stroke="#000" stroke-width="4"/>

  <!-- viewers -->
  <rect x="330" y="34" width="230" height="64" fill="#fff" stroke="#000" stroke-width="3"/>
  <text x="445" y="62" text-anchor="middle" class="sans" font-size="20" font-weight="700">iPhone app</text>
  <text x="445" y="84" text-anchor="middle" class="mono" font-size="14">SwiftUI + AVPlayer</text>

  <rect x="640" y="34" width="230" height="64" fill="#fff" stroke="#000" stroke-width="3"/>
  <text x="755" y="62" text-anchor="middle" class="sans" font-size="20" font-weight="700">Browser</text>
  <text x="755" y="84" text-anchor="middle" class="mono" font-size="14">hls.js</text>

  <line x1="445" y1="98" x2="445" y2="148" stroke="#000" stroke-width="3" marker-end="url(#ah)"/>
  <line x1="755" y1="98" x2="755" y2="148" stroke="#000" stroke-width="3" marker-end="url(#ah)"/>
  <text x="600" y="130" text-anchor="middle" class="mono" font-size="15" font-weight="700">https, one domain</text>

  <!-- CloudFront -->
  <rect x="100" y="150" width="1000" height="180" fill="#2B3FFF" stroke="#000" stroke-width="4"/>
  <text x="124" y="183" class="sans" font-size="20" font-weight="700" fill="#fff">CloudFront: one distribution, one domain, three behaviors</text>

  <rect x="130" y="205" width="250" height="100" fill="#fff" stroke="#000" stroke-width="3"/>
  <text x="255" y="241" text-anchor="middle" class="mono" font-size="22" font-weight="700">/api/*</text>
  <text x="255" y="268" text-anchor="middle" class="sans" font-size="15">dynamic, never cached</text>
  <text x="255" y="288" text-anchor="middle" class="sans" font-size="15">forwards to API Gateway</text>

  <rect x="480" y="205" width="280" height="100" fill="#fff" stroke="#000" stroke-width="3"/>
  <text x="620" y="241" text-anchor="middle" class="mono" font-size="22" font-weight="700">/ (default)</text>
  <text x="620" y="268" text-anchor="middle" class="sans" font-size="15">the web app</text>
  <text x="620" y="288" text-anchor="middle" class="sans" font-size="15">cached, served from S3</text>

  <rect x="820" y="205" width="260" height="100" fill="#fff" stroke="#000" stroke-width="6"/>
  <text x="950" y="241" text-anchor="middle" class="mono" font-size="22" font-weight="700">/videos/*</text>
  <text x="950" y="268" text-anchor="middle" class="sans" font-size="15" font-weight="700">signed cookie, or 403</text>
  <text x="950" y="288" text-anchor="middle" class="sans" font-size="15">checked at the edge</text>

  <!-- behaviors down to origins -->
  <line x1="255" y1="305" x2="255" y2="398" stroke="#000" stroke-width="3" marker-end="url(#ah)"/>

  <!-- API Gateway + Lambda -->
  <rect x="130" y="400" width="250" height="50" fill="#fff" stroke="#000" stroke-width="3"/>
  <text x="255" y="432" text-anchor="middle" class="sans" font-size="17" font-weight="700">API Gateway (HTTP API)</text>
  <line x1="255" y1="450" x2="255" y2="488" stroke="#000" stroke-width="3" marker-end="url(#ah)"/>

  <rect x="130" y="490" width="250" height="160" fill="#000" stroke="#000" stroke-width="3"/>
  <text x="255" y="521" text-anchor="middle" class="sans" font-size="19" font-weight="700" fill="#fff">Lambda (Python)</text>
  <g class="mono" font-size="14" fill="#fff" text-anchor="middle">
    <text x="255" y="552">login + catalog</text>
    <text x="255" y="573">stream-auth cookies</text>
    <text x="255" y="594">upload presigning</text>
    <text x="255" y="615">archive management</text>
    <text x="255" y="636">ffmpeg packager</text>
  </g>

  <line x1="190" y1="650" x2="190" y2="688" stroke="#000" stroke-width="3" marker-end="url(#ah)"/>
  <line x1="320" y1="650" x2="320" y2="688" stroke="#000" stroke-width="3" marker-end="url(#ah)"/>

  <rect x="130" y="690" width="120" height="58" fill="#fff" stroke="#000" stroke-width="3"/>
  <text x="190" y="716" text-anchor="middle" class="sans" font-size="16" font-weight="700">DynamoDB</text>
  <text x="190" y="737" text-anchor="middle" class="mono" font-size="13">users, videos</text>

  <rect x="260" y="690" width="120" height="58" fill="#fff" stroke="#000" stroke-width="3"/>
  <text x="320" y="716" text-anchor="middle" class="sans" font-size="16" font-weight="700">SSM</text>
  <text x="320" y="737" text-anchor="middle" class="mono" font-size="13">signing key</text>

  <!-- S3 -->
  <rect x="480" y="380" width="620" height="190" fill="#FFD400" stroke="#000" stroke-width="4"/>

  <rect x="500" y="420" width="190" height="70" fill="#fff" stroke="#000" stroke-width="3"/>
  <text x="595" y="452" text-anchor="middle" class="mono" font-size="20" font-weight="700">site/*</text>
  <text x="595" y="475" text-anchor="middle" class="sans" font-size="14">web app files</text>

  <rect x="715" y="420" width="190" height="70" fill="#fff" stroke="#000" stroke-width="3"/>
  <text x="810" y="452" text-anchor="middle" class="mono" font-size="20" font-weight="700">videos/*</text>
  <text x="810" y="475" text-anchor="middle" class="sans" font-size="14">HLS playlists + segments</text>

  <rect x="930" y="420" width="150" height="70" fill="#fff" stroke="#000" stroke-width="3"/>
  <text x="1005" y="452" text-anchor="middle" class="mono" font-size="20" font-weight="700">uploads/*</text>
  <text x="1005" y="475" text-anchor="middle" class="sans" font-size="14">staged originals</text>

  <text x="500" y="538" class="sans" font-size="16" font-weight="700">S3 bucket: private, Block Public Access on, no public policy</text>

  <line x1="595" y1="305" x2="595" y2="418" stroke="#000" stroke-width="3" marker-end="url(#ah)"/>
  <line x1="850" y1="305" x2="850" y2="418" stroke="#000" stroke-width="3" marker-end="url(#ah)"/>

  <!-- packager arrow -->
  <text x="430" y="538" text-anchor="middle" class="mono" font-size="13">packager</text>
  <line x1="380" y1="552" x2="478" y2="552" stroke="#000" stroke-width="3" marker-end="url(#ah)"/>

  <!-- direct upload path -->
  <path d="M870 66 H1150 V455 H1084" fill="none" stroke="#2B3FFF" stroke-width="4" stroke-dasharray="10 7" marker-end="url(#ahb)"/>
  <text transform="translate(1178 262) rotate(-90)" text-anchor="middle" class="mono" font-size="15" font-weight="700" fill="#2B3FFF">presigned PUTs: the browser uploads straight to S3</text>

  <!-- note -->
  <rect x="480" y="610" width="620" height="138" fill="#fff" stroke="#000" stroke-width="3"/>
  <text x="504" y="647" class="sans" font-size="20" font-weight="700">Playback never touches Lambda.</text>
  <text x="504" y="678" class="sans" font-size="16">CloudFront validates the signed cookie at the edge, then serves</text>
  <text x="504" y="701" class="sans" font-size="16">playlists and segments straight from S3. The API never handles</text>
  <text x="504" y="724" class="sans" font-size="16">video bytes, in either direction.</text>
</svg>
