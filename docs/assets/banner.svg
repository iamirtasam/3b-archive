<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">3B Archive</title>
  <desc id="d">A private, YouTube-style streaming platform built on S3, CloudFront and Lambda.</desc>

  <rect width="1200" height="340" fill="#2B3FFF"/>
  <rect x="4" y="4" width="1192" height="332" fill="none" stroke="#000" stroke-width="8"/>

  <!-- wordmark with hard shadow -->
  <g font-family="'Arial Black','Helvetica Neue',Helvetica,Arial,sans-serif" font-weight="900" font-size="120">
    <text x="68" y="196" fill="#000" textLength="740" lengthAdjust="spacingAndGlyphs">3B Archive</text>
    <text x="60" y="188" fill="#fff" textLength="740" lengthAdjust="spacingAndGlyphs">3B Archive</text>
  </g>

  <g font-family="'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="22" fill="#fff">
    <text x="62" y="244" textLength="600" lengthAdjust="spacingAndGlyphs">A private, YouTube-style streaming platform.</text>
    <text x="62" y="280" textLength="660" lengthAdjust="spacingAndGlyphs">S3 + CloudFront + Lambda. Lossless HLS. Web + iOS.</text>
  </g>

  <!-- player block -->
  <rect x="876" y="80" width="290" height="200" fill="#000"/>
  <rect x="866" y="70" width="290" height="200" fill="#fff" stroke="#000" stroke-width="5"/>
  <polygon points="985,108 985,186 1050,147" fill="#2B3FFF" stroke="#000" stroke-width="4" stroke-linejoin="miter"/>

  <!-- HLS segments: watched = solid, upcoming = outline -->
  <g stroke="#000" stroke-width="3">
    <rect x="881" y="220" width="18" height="24" fill="#000"/>
    <rect x="903" y="220" width="18" height="24" fill="#000"/>
    <rect x="925" y="220" width="18" height="24" fill="#000"/>
    <rect x="947" y="220" width="18" height="24" fill="#000"/>
    <rect x="969" y="220" width="18" height="24" fill="#000"/>
    <rect x="991" y="220" width="18" height="24" fill="#000"/>
    <rect x="1013" y="220" width="18" height="24" fill="#000"/>
    <rect x="1035" y="220" width="18" height="24" fill="none"/>
    <rect x="1057" y="220" width="18" height="24" fill="none"/>
    <rect x="1079" y="220" width="18" height="24" fill="none"/>
    <rect x="1101" y="220" width="18" height="24" fill="none"/>
    <rect x="1123" y="220" width="18" height="24" fill="none"/>
  </g>

  <!-- sticker -->
  <g transform="translate(1096 70) rotate(7)">
    <rect x="-72" y="-22" width="144" height="44" fill="#FFD400" stroke="#000" stroke-width="3"/>
    <text x="0" y="8" text-anchor="middle" font-family="'Arial Black','Helvetica Neue',Helvetica,Arial,sans-serif" font-weight="900" font-size="22" fill="#000">PRIVATE</text>
  </g>
</svg>
