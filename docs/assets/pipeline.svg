<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">3B Archive video pipeline</title>
  <desc id="d">Five steps from upload to playback: the upload lands in S3, a Lambda packager remuxes it with ffmpeg without re-encoding, segments are uploaded as they are produced, a poster and catalog entry are written, and the video goes live.</desc>

  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#000"/>
    </marker>
  </defs>

  <style>
    .sans { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
  </style>

  <rect x="2" y="2" width="1196" height="396" fill="#F3F3EF" stroke="#000" stroke-width="4"/>

  <text x="24" y="44" class="mono" font-size="17" font-weight="700">recording.mp4 (H.264 + AAC, up to 50 GB) becomes a live HLS stream</text>

  <!-- 1 -->
  <rect x="26" y="82" width="200" height="170" fill="#000"/>
  <rect x="20" y="76" width="200" height="170" fill="#fff" stroke="#000" stroke-width="3"/>
  <rect x="20" y="76" width="44" height="44" fill="#2B3FFF" stroke="#000" stroke-width="3"/>
  <text x="42" y="107" text-anchor="middle" class="sans" font-size="22" font-weight="700" fill="#fff">1</text>
  <text x="34" y="150" class="sans" font-size="18" font-weight="700">Upload lands</text>
  <text x="34" y="176" class="sans" font-size="14">16 MB parts to S3</text>
  <text x="34" y="197" class="sans" font-size="14">multipart completes</text>
  <text x="34" y="218" class="sans" font-size="14">packager starts async</text>

  <!-- 2 -->
  <rect x="266" y="82" width="200" height="170" fill="#000"/>
  <rect x="260" y="76" width="200" height="170" fill="#fff" stroke="#000" stroke-width="3"/>
  <rect x="260" y="76" width="44" height="44" fill="#2B3FFF" stroke="#000" stroke-width="3"/>
  <text x="282" y="107" text-anchor="middle" class="sans" font-size="22" font-weight="700" fill="#fff">2</text>
  <text x="274" y="150" class="sans" font-size="18" font-weight="700">Remux only</text>
  <text x="274" y="176" class="mono" font-size="13">ffmpeg -c copy</text>
  <text x="274" y="197" class="sans" font-size="14">input: presigned S3 URL</text>
  <text x="274" y="218" class="sans" font-size="14">range requests, seekable</text>

  <!-- 3 -->
  <rect x="506" y="82" width="200" height="170" fill="#000"/>
  <rect x="500" y="76" width="200" height="170" fill="#fff" stroke="#000" stroke-width="3"/>
  <rect x="500" y="76" width="44" height="44" fill="#2B3FFF" stroke="#000" stroke-width="3"/>
  <text x="522" y="107" text-anchor="middle" class="sans" font-size="22" font-weight="700" fill="#fff">3</text>
  <text x="514" y="150" class="sans" font-size="18" font-weight="700">Upload as it goes</text>
  <text x="514" y="176" class="mono" font-size="13">init.mp4 + seg_*.m4s</text>
  <text x="514" y="197" class="sans" font-size="14">watcher uploads each</text>
  <text x="514" y="218" class="sans" font-size="14">then deletes it locally</text>

  <!-- 4 -->
  <rect x="746" y="82" width="200" height="170" fill="#000"/>
  <rect x="740" y="76" width="200" height="170" fill="#fff" stroke="#000" stroke-width="3"/>
  <rect x="740" y="76" width="44" height="44" fill="#2B3FFF" stroke="#000" stroke-width="3"/>
  <text x="762" y="107" text-anchor="middle" class="sans" font-size="22" font-weight="700" fill="#fff">4</text>
  <text x="754" y="150" class="sans" font-size="18" font-weight="700">Poster + catalog</text>
  <text x="754" y="176" class="sans" font-size="14">poster from segment 1</text>
  <text x="754" y="197" class="sans" font-size="14">DynamoDB entry written</text>
  <text x="754" y="218" class="sans" font-size="14">source file deleted</text>

  <!-- 5 -->
  <rect x="986" y="82" width="200" height="170" fill="#000"/>
  <rect x="980" y="76" width="200" height="170" fill="#FFD400" stroke="#000" stroke-width="5"/>
  <rect x="980" y="76" width="44" height="44" fill="#2B3FFF" stroke="#000" stroke-width="3"/>
  <text x="1002" y="107" text-anchor="middle" class="sans" font-size="22" font-weight="700" fill="#fff">5</text>
  <text x="994" y="150" class="sans" font-size="18" font-weight="700">Live on the site</text>
  <text x="994" y="176" class="mono" font-size="11.5">/videos/&lt;slug&gt;/index.m3u8</text>
  <text x="994" y="197" class="sans" font-size="14">gated by signed cookie</text>
  <text x="994" y="218" class="sans" font-size="14">ready within minutes</text>

  <!-- arrows -->
  <line x1="224" y1="161" x2="256" y2="161" stroke="#000" stroke-width="4" marker-end="url(#ah)"/>
  <line x1="464" y1="161" x2="496" y2="161" stroke="#000" stroke-width="4" marker-end="url(#ah)"/>
  <line x1="704" y1="161" x2="736" y2="161" stroke="#000" stroke-width="4" marker-end="url(#ah)"/>
  <line x1="944" y1="161" x2="976" y2="161" stroke="#000" stroke-width="4" marker-end="url(#ah)"/>

  <!-- band -->
  <rect x="20" y="288" width="1160" height="86" fill="#2B3FFF" stroke="#000" stroke-width="3"/>
  <text x="40" y="324" class="sans" font-size="20" font-weight="700" fill="#fff">Scratch space stays flat: a 2 GB and a 40 GB recording only ever hold a few segments in /tmp.</text>
  <text x="40" y="352" class="sans" font-size="15" fill="#fff">Lambda limits: 15 minute ceiling, 10 GB of scratch. Exotic codecs and anything beyond 50 GB use the local pipeline.</text>
</svg>
